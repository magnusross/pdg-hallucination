name: l40s
scientific_validity: development_only
ranking_recipe: l40s
design:
  batch_size: 1
  supports_msa: false
  language_model:
    factory: mosaic.losses.esmc.load_esmc
    checkpoint: Biohub/ESMC-300M
  structure_models:
    - name: esmfold2_experimental_fast_1000k
      factory: mosaic.models.esmfold2.ESMFold2ExperimentalFast300M
      checkpoint: biohub/ESMFold2-Experimental-Fast-base300M-step1000k
      steps: 1000k
    - name: esmfold2_experimental_fast_1500k
      factory: mosaic.models.esmfold2.ESMFold2ExperimentalFast300M
      checkpoint: biohub/ESMFold2-Experimental-Fast-base300M-step1500k
      steps: 1500k
  inference:
    recycling_steps: 1
    sampling_steps: 14
    num_diffusion_samples: 1
    lm_dropout: 0.5
    msa_max_depth: 1024
cache:
  offline: false
  root: ${oc.env:MOSAIC_CACHE_DIR,${oc.env:XDG_CACHE_HOME,${oc.env:HOME}/.cache}/mosaic}
resources:
  gpus_per_task: 1
